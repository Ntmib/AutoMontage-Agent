<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8">
<style>
  @font-face{font-family:'Osw';src:url('../public/fonts/Oswald.ttf');}
  @font-face{font-family:'JBM';src:url('../public/fonts/JetBrainsMono.ttf');}
  @font-face{font-family:'One';src:url('../public/fonts/Onest.ttf');}
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:1024px;height:1536px;overflow:hidden;font-family:'One',sans-serif;}
  body{background:radial-gradient(120% 80% at 50% 10%,#F4ECDE,#E7D5BF);
    display:flex;align-items:center;justify-content:center;position:relative;}
  .grid{position:absolute;inset:0;opacity:.08;
    background-image:linear-gradient(#3D2E24 1px,transparent 1px),linear-gradient(90deg,#3D2E24 1px,transparent 1px);
    background-size:58px 58px;}
  .tag{position:absolute;top:80px;left:70px;font-family:'JBM';font-weight:700;font-size:30px;
    letter-spacing:4px;color:#B85C3E;text-transform:uppercase;}
  .win{width:860px;border-radius:26px;overflow:hidden;background:#2A211B;
    box-shadow:0 46px 100px rgba(61,46,36,.5);border:3px solid rgba(61,46,36,.25);transform:rotate(-1.5deg);}
  .bar{height:70px;background:#3D2E24;display:flex;align-items:center;padding:0 26px;gap:13px;}
  .dot{width:19px;height:19px;border-radius:50%;} .u{background:#CC785C}.m{background:#D8A05C}.g{background:#C9C2A8}
  .title{color:#EDE4D3;font-family:'JBM';font-size:24px;letter-spacing:1px;margin-left:18px;opacity:.85;}
  .shot{display:block;width:100%;}
  .strip{background:#211E1A;padding:20px 24px;display:flex;gap:8px;align-items:center;}
  .clip{height:66px;border-radius:8px;flex:0 0 auto;}
  .badge{position:absolute;top:150px;right:80px;background:#CC785C;color:#FBF7F0;font-family:'Osw';
    font-weight:700;font-size:44px;letter-spacing:2px;padding:16px 34px;border-radius:16px;
    transform:rotate(3deg);box-shadow:0 16px 30px rgba(61,46,36,.32);text-transform:uppercase;}
</style></head>
<body>
  <div class="grid"></div>
  <div class="tag">// скриншот кадра</div>
  <div class="win">
    <div class="bar"><span class="dot u"></span><span class="dot m"></span><span class="dot g"></span>
      <span class="title">монтаж — превью.mp4</span></div>
    <img class="shot" src="shot_frame.jpg">
    <div class="strip">
      <div class="clip" style="flex-basis:120px;background:#CC785C"></div>
      <div class="clip" style="flex-basis:80px;background:#7c9a6d"></div>
      <div class="clip" style="flex-basis:160px;background:#D8A05C"></div>
      <div class="clip" style="flex-basis:90px;background:#B85C3E"></div>
    </div>
  </div>
  <div class="badge">Скриншот ✓</div>
</body></html>
